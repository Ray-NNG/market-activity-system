<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诊断页面</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .section h2 { margin-top: 0; }
    .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .warning { background: #fff3cd; color: #856404; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    #console-output { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>市场活动管理系统 - 诊断工具</h1>
  
  <div class="section">
    <h2>1. 浏览器信息</h2>
    <div id="browser-info"></div>
  </div>
  
  <div class="section">
    <h2>2. JavaScript 函数检查</h2>
    <div id="function-check"></div>
  </div>
  
  <div class="section">
    <h2>3. 功能测试</h2>
    <button onclick="testFunction('openNewActivity')">测试 openNewActivity</button>
    <button onclick="testFunction('createActivity')">测试 createActivity</button>
    <button onclick="testFunction('showModal')">测试 showModal</button>
    <button onclick="testFunction('initBudgetItems')">测试 initBudgetItems</button>
    <div id="test-results"></div>
  </div>
  
  <div class="section">
    <h2>4. 控制台日志</h2>
    <div id="console-output"></div>
  </div>
  
  <div class="section">
    <h2>5. 常见问题</h2>
    <ul>
      <li>如果按钮点击无反应,请打开浏览器开发者工具(F12)查看Console标签</li>
      <li>尝试使用Ctrl+F5(Windows)或Cmd+Shift+R(Mac)强制刷新页面</li>
      <li>如果看到"函数未定义",说明JavaScript可能加载失败</li>
      <li>如果看到"CORS错误"或"404错误",说明API连接有问题</li>
    </ul>
  </div>
  
  <script>
    // 拦截 console.log
    const originalLog = console.log;
    const consoleOutput = document.getElementById('console-output');
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      consoleOutput.innerHTML += '<div style="color: black">📝 ' + args.join(' ') + '</div>';
    };
    
    console.error = function(...args) {
      originalLog.apply(console, args);
      consoleOutput.innerHTML += '<div style="color: red">❌ ' + args.join(' ') + '</div>';
    };
    
    console.warn = function(...args) {
      originalLog.apply(console, args);
      consoleOutput.innerHTML += '<div style="color: orange">⚠️ ' + args.join(' ') + '</div>';
    };
    
    // 浏览器信息
    document.getElementById('browser-info').innerHTML = `
      <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
      <p><strong>语言:</strong> ${navigator.language}</p>
      <p><strong>Cookies 启用:</strong> ${navigator.cookieEnabled ? '是' : '否'}</p>
      <p><strong>LocalStorage:</strong> ${typeof localStorage !== 'undefined' ? '可用' : '不可用'}</p>
    `;
    
    // 检查函数
    const functions = ['openNewActivity', 'createActivity', 'showModal', 'initBudgetItems', 'renderDashboard', 'syncData'];
    let functionResults = '';
    
    functions.forEach(funcName => {
      const exists = typeof window[funcName] === 'function';
      functionResults += `<div class="status ${exists ? 'success' : 'error'}">
        ${exists ? '✅' : '❌'} ${funcName}: ${exists ? '已定义' : '未定义'}
      </div>`;
    });
    
    document.getElementById('function-check').innerHTML = functionResults;
    
    // 测试函数
    function testFunction(funcName) {
      const resultDiv = document.getElementById('test-results');
      try {
        if (typeof window[funcName] === 'function') {
          console.log(`调用 ${funcName}()...`);
          window[funcName]();
          resultDiv.innerHTML += `<div class="status success">✅ ${funcName}() 调用成功</div>`;
        } else {
          resultDiv.innerHTML += `<div class="status error">❌ ${funcName} 未定义</div>`;
        }
      } catch (e) {
        resultDiv.innerHTML += `<div class="status error">❌ ${funcName}() 调用失败: ${e.message}</div>`;
      }
    }
    
    // 页面加载完成后的检查
    window.addEventListener('load', function() {
      console.log('页面加载完成');
      console.log('当前页面URL:', window.location.href);
      
      // 尝试从主页面加载函数
      console.log('尝试从主页面获取函数...');
      
      // 检查是否在主页面还是单独的页面
      if (window.location.pathname.includes('index.html') || window.location.pathname === '/') {
        console.log('在主页面,检查关键变量...');
        console.log('activities 类型:', typeof window.activities);
        console.log('JSONBIN_MASTER_KEY:', typeof window.JSONBIN_MASTER_KEY);
      } else {
        console.log('在独立页面,跳过变量检查');
      }
    });
  </script>
</body>
</html>
