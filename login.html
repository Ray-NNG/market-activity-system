<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市场活动全流程管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .input-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
      box-shadow: none;
    }
    .error {
      color: #ef4444;
      font-size: 14px;
      margin-top: 10px;
      min-height: 20px;
    }
    .success {
      color: #10b981;
      font-size: 14px;
      margin-top: 10px;
      min-height: 20px;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">📊</div>
    <h1 class="title">市场活动管理系统</h1>
    <p class="subtitle">Market Campaign Manager</p>

    <div class="input-group">
      <label for="password">访问密码</label>
      <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')handleLogin()">
    </div>

    <button class="btn" onclick="handleLogin()">进入系统</button>
    <button class="btn btn-secondary" onclick="goToAdmin()">进入后台管理</button>

    <div id="message" class="error"></div>

    <p class="hint">
      默认密码：<strong>admin123</strong><br>
      可以在后台管理中修改密码
    </p>
  </div>

  <script>
    // 从 localStorage 读取密码
    const LOGIN_PASSWORD = localStorage.getItem('mcm_password') || 'admin123';

    // 登录处理函数
    function handleLogin() {
      const input = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      if (input === LOGIN_PASSWORD) {
        // 登录成功
        localStorage.setItem('mcm_auth_ts', Date.now().toString());
        messageEl.textContent = '✅ 登录成功，正在跳转...';
        messageEl.className = 'success';

        // 跳转到原系统（index.html）
        setTimeout(() => {
          window.location.href = 'index.html?auth=' + Date.now();
        }, 500);
      } else {
        // 登录失败
        messageEl.textContent = '❌ 密码错误，请重新输入';
        messageEl.className = 'error';

        const inputEl = document.getElementById('password');
        inputEl.style.borderColor = '#ef4444';
        inputEl.value = '';

        setTimeout(() => {
          inputEl.style.borderColor = '#e2e8f0';
          inputEl.focus();
        }, 500);
      }
    }

    // 跳转到后台管理
    function goToAdmin() {
      window.location.href = 'admin.html';
    }

    // 自动聚焦到密码输入框
    window.onload = function() {
      document.getElementById('password').focus();
    };
  </script>
</body>
</html>
